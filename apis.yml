aid: protent
name: Protent
description: Protent is a San Francisco based Y Combinator (Winter 2026) startup building
  a real-time video intelligence platform for law enforcement and public safety teams. Its
  software monitors many live surveillance, CCTV, and bodycam feeds at once, automatically
  prioritizing critical streams when escalation or volatility is detected, and lets teams run
  natural-language searches across active feeds (for example, "a person in a red hoodie with a
  backpack"). Founded in 2025 by Srihan Balaji (ex-Lockheed Martin Research, AWS) and Abhisheik
  Sharma (CTO, NLP/sentiment analysis), the company works with police departments in the Atlanta,
  Chicago, and St. Louis metro areas. As of this profile, Protent publishes a marketing website
  only and exposes no public API, developer documentation, or SDK surface.
